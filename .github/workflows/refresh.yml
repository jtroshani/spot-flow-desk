name: Refresh flow data

on:
  schedule:
    - cron: "7 * * * *" # every hour at :07
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest flows
        run: python3 update_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data.js; then
            echo "No new flows."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Update flow data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
