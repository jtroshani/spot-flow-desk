<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --hover: #f1f3f6;
  --seg: #eceef2;
  --ink: #0f131a;
  --ink-2: #545d6b;
  --muted: #8d95a3;
  --line: #eceef2;
  --axis: #d5d9e0;
  --in: #0e8f86;
  --out: #e5533d;
  --in-text: #0a7a72;
  --out-text: #c43f2b;
  --flash: rgba(14, 143, 134, 0.16);
  --btc: #f0a000;
  --eth: #6d7fe8;
  --sol: #a86cf5;
  --xrp: #8b99ad;
  --focus: #3b6fe0;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a0d12;
    --panel: #11161d;
    --hover: #171d26;
    --seg: #161c24;
    --ink: #e9edf3;
    --ink-2: #a3acb9;
    --muted: #677183;
    --line: #1b222c;
    --axis: #2c3542;
    --in: #1a9e94;
    --out: #e2583f;
    --in-text: #3cc2b6;
    --out-text: #f27a63;
    --flash: rgba(26, 158, 148, 0.22);
    --focus: #7ea2ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0d12;
  --panel: #11161d;
  --hover: #171d26;
  --seg: #161c24;
  --ink: #e9edf3;
  --ink-2: #a3acb9;
  --muted: #677183;
  --line: #1b222c;
  --axis: #2c3542;
  --in: #1a9e94;
  --out: #e2583f;
  --in-text: #3cc2b6;
  --out-text: #f27a63;
  --flash: rgba(26, 158, 148, 0.22);
  --focus: #7ea2ff;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 24px; padding-block: 0 56px; display: grid; gap: 18px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.pos { color: var(--in-text); }
.neg { color: var(--out-text); }
.flat { color: var(--muted); }
.label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Top bar with hourly refresh */
.bar { position: sticky; top: 0; z-index: 10; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.bar-in { display: flex; align-items: center; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; padding-block: 18px 12px; }
.bar h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.bar h1 span { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 13px; }
.progress { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--in); transition: width 1s linear; }
.progress.busy i { width: 100% !important; animation: sweep 1s ease-in-out infinite; transform-origin: left; }
@keyframes sweep { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); opacity: .2; } }

.status { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 7px; color: var(--ink); font-weight: 500; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--in); position: relative; }
.pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--in); animation: ping 2s ease-out infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(2.6); opacity: 0; } }
.status.err .pulse, .status.err .pulse::after { background: var(--out); }
.status .sep { width: 1px; height: 12px; background: var(--axis); }
.refresh { background: var(--seg); border: 0; border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.refresh:hover { color: var(--ink); }
.refresh svg { width: 13px; height: 13px; }
.refresh.spin svg { animation: rot .8s linear infinite; }
.theme-btn { padding: 5px 8px; }
.theme-btn svg { width: 14px; height: 14px; }
.theme-btn .i-sun { display: none; }
.is-dark .theme-btn .i-sun { display: block; }
.is-dark .theme-btn .i-moon { display: none; }
@keyframes rot { to { transform: rotate(360deg); } }

/* Controls */
.controls { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 14px; }
.seg { display: inline-flex; background: var(--seg); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { font-weight: 500; color: var(--ink-2); background: transparent; border: 0; padding: 6px 13px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* Surfaces */
.panel { background: var(--panel); border-radius: 14px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; padding: 16px 20px 0; }
.panel-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.panel-head .hint { color: var(--muted); font-size: 12px; }

/* Overview cards */
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 0; border-radius: 14px; padding: 18px 18px 14px; display: grid; gap: 10px; cursor: pointer; text-align: left; transition: background .15s; }
.card:hover { background: var(--hover); }
.coin { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.big { font-size: 28px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.1; border-radius: 6px; }
.gross { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.gross span { display: inline-flex; align-items: center; gap: 5px; }
.sq { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
.spark { height: 72px; position: relative; }
.spark-foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--mono); }

/* Tables */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 20px; text-align: right; white-space: nowrap; }
td { border-top: 1px solid var(--line); }
th { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding-top: 16px; padding-bottom: 10px; }
th:first-child, td:first-child { text-align: left; }
th.hl { color: var(--ink); }
td.hl { font-weight: 600; }
tbody tr[tabindex] { cursor: pointer; }
tbody tr[tabindex]:hover td { background: var(--hover); }
tr.sel td { background: var(--hover); }
.pct { display: inline-flex; align-items: center; gap: 8px; }
.pct .track { width: 48px; height: 4px; background: var(--line); border-radius: 2px; position: relative; overflow: hidden; }
.pct .fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; }

/* Single asset */
.head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
.head h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.head .meta { color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 620px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--panel); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.tile.hl { box-shadow: inset 0 0 0 1px var(--axis); }
.tile .v { font-size: 22px; font-weight: 500; letter-spacing: -0.035em; border-radius: 6px; }
.tile .sub { font-size: 11.5px; color: var(--muted); }
.chart { height: 300px; position: relative; margin: 10px 14px 14px 8px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 12px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.issuers { padding: 12px 20px 18px; display: grid; gap: 4px; }
.irow { display: grid; grid-template-columns: 110px minmax(0, 1fr) 76px; align-items: center; gap: 10px; padding: 4px 0; }
.irow .who { line-height: 1.2; min-width: 0; }
.irow .who b { font-weight: 500; font-family: var(--mono); font-size: 12.5px; }
.irow .who small { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .val { text-align: right; font-size: 12.5px; }
.dtrack { height: 12px; position: relative; }
.dtrack::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.dtrack i { position: absolute; top: 1px; bottom: 1px; display: block; }
.dtrack i.p { left: calc(50% + 1px); border-radius: 0 3px 3px 0; background: var(--in); }
.dtrack i.n { right: calc(50% + 1px); border-radius: 3px 0 0 3px; background: var(--out); }
.note { color: var(--muted); font-size: 12px; padding-top: 4px; }
.recent th, .recent td { padding: 10px 18px; }

/* Tooltip */
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--panel); border: 1px solid var(--axis); border-radius: 10px; padding: 10px 12px; font-size: 12px; box-shadow: 0 10px 28px rgba(0,0,0,.14); min-width: 190px; display: grid; gap: 4px; }
.tip .t { font-weight: 600; margin-bottom: 2px; }
.tip .r { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2); }
.tip .r .num { color: var(--ink); }
.tip .r.main .num { font-weight: 600; }

svg text { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
svg .hit { fill: transparent; cursor: pointer; }
svg .hit:hover, svg .hit.on { fill: var(--hover); }

.flash { animation: flash 2.4s ease-out; }
@keyframes flash { 0%, 30% { background: var(--flash); } 100% { background: transparent; } }

.foot { color: var(--muted); font-size: 12px; }
.foot a { color: var(--ink-2); }

@media (max-width: 560px) {
  .wrap { padding-inline: 16px; }
  .seg button { padding: 6px 10px; }
  .irow { grid-template-columns: 88px minmax(0, 1fr) 68px; }
  .big { font-size: 24px; }
  .bar h1 span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::after { animation: none !important; transition: none !important; }
}
</style>

<header class="bar">
  <div class="wrap" style="padding-bottom:0;gap:0">
    <div class="bar-in">
      <h1>Spot Flow Desk<span>US spot crypto ETF net flows</span></h1>
      <div class="status" id="status" aria-live="polite">
        <span class="live"><span class="pulse" aria-hidden="true"></span><span id="liveText">Refreshes hourly</span></span>
        <span class="sep" aria-hidden="true"></span>
        <span>Checked <b class="num" id="checked">--:--</b></span>
        <span>Next in <b class="num" id="countdown">60:00</b></span>
        <button class="refresh" id="refreshBtn" type="button" title="Refresh now">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>Refresh
        </button>
        <button class="refresh theme-btn" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="i-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1z"/></svg>
          <svg class="i-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.3M8 13.2v1.3M1.5 8h1.3M13.2 8h1.3M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9"/></svg>
        </button>
      </div>
    </div>
    <div class="progress" id="progress" role="progressbar" aria-label="Time until next refresh" aria-valuemin="0" aria-valuemax="100"><i></i></div>
  </div>

<div class="wrap">
  <nav class="controls" aria-label="View">
    <div class="seg" id="coinSeg" role="group" aria-label="Asset"></div>
    <div class="seg" id="periodSeg" role="group" aria-label="Period"></div>

  <p class="foot" id="foot"></p>
</div>

<script src="data.js"></script>
<script>
(function () {
  const HOUR = 60 * 60 * 1000;
  const COINS = [
    { sym: "BTC", name: "Bitcoin", color: "var(--btc)" },
    { sym: "ETH", name: "Ethereum", color: "var(--eth)" },
    { sym: "SOL", name: "Solana", color: "var(--sol)" },
    { sym: "XRP", name: "XRP", color: "var(--xrp)" },
  ];
  const PERIODS = [
    { id: "D", name: "Daily", cur: "Latest session", n: 30, big: 90, unit: "sessions" },
    { id: "W", name: "Weekly", cur: "This week", n: 26, big: 52, unit: "weeks" },
    { id: "M", name: "Monthly", cur: "This month", n: 12, big: 36, unit: "months" },
    { id: "Y", name: "Yearly", cur: "Year to date", n: 10, big: 10, unit: "years" },
  ];
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- dates ----------
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const iso = (dt) => dt.toISOString().slice(0, 10);
  const weekKey = (s) => { const dt = parse(s); dt.setUTCDate(dt.getUTCDate() - (dt.getUTCDay() + 6) % 7); return iso(dt); };
  const KEY = { D: (s) => s, W: weekKey, M: (s) => s.slice(0, 7), Y: (s) => s.slice(0, 4) };

  // ---------- data model (rebuilt on every refresh) ----------
  let D, data, asOf;
  function build(src) {
    D = src; asOf = D.asOf; data = {};
    COINS.forEach((c) => {
      const s = D.coins[c.sym];
      const days = s.rows.map((r) => {
        const funds = r.slice(2);
        let gin = 0, gout = 0;
        funds.forEach((v) => { if (v > 0) gin += v; else gout += v; });
        if (gin === 0 && gout === 0 && r[1] !== 0) { if (r[1] > 0) gin = r[1]; else gout = r[1]; }
        return { date: r[0], net: r[1], funds, gin, gout };
      });
      const agg = {};
      PERIODS.forEach((p) => {
        const list = [], idx = {};
        days.forEach((d) => {
          const k = KEY[p.id](d.date);
          let b = idx[k];
          if (!b) { b = idx[k] = { key: k, first: d.date, last: d.date, net: 0, gin: 0, gout: 0, funds: s.funds.map(() => 0), up: 0, down: 0 }; list.push(b); }
          b.last = d.date; b.net += d.net; b.gin += d.gin; b.gout += d.gout;
          if (d.net > 0.05) b.up++; else if (d.net < -0.05) b.down++;
          d.funds.forEach((v, i) => (b.funds[i] += v));
        });
        agg[p.id] = { list, idx };
      });
      data[c.sym] = { ...c, funds: s.funds, aum: s.aum, days, agg, total: days.reduce((t, d) => t + d.net, 0), launch: days[0].date };
    });
  }
  const current = (sym, p) => {
    const a = data[sym].agg[p];
    if (p === "D") return a.list[a.list.length - 1];
    const k = KEY[p](asOf);
    return a.idx[k] || { key: k, net: 0, gin: 0, gout: 0, funds: data[sym].funds.map(() => 0), up: 0, down: 0, first: asOf, last: asOf };
  };

  // ---------- formatting ----------
  const MINUS = "−";
  function money(m, opts = {}) {
    const a = Math.abs(m);
    if (a < 0.05) return "$0";
    const sign = opts.sign === false ? "" : m > 0 ? "+" : MINUS;
    const s = a >= 1000 ? "$" + (a / 1000).toFixed(a >= 10000 ? 1 : 2) + "B" : a >= 100 ? "$" + a.toFixed(0) + "M" : "$" + a.toFixed(1) + "M";
    return sign + s;
  }
  const cls = (m) => (m > 0.0499 ? "pos" : m < -0.0499 ? "neg" : "flat");
  const signed = (m) => `<span class="num ${cls(m)}">${money(m)}</span>`;
  const shortDay = (s) => { const d = parse(s); return MON[d.getUTCMonth()] + " " + d.getUTCDate(); };
  const longDay = (s) => { const d = parse(s); return DOW[d.getUTCDay()] + ", " + MON[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + d.getUTCFullYear(); };
  function bucketLabel(b, p, long) {
    if (p === "D") return long ? longDay(b.key) : shortDay(b.key);
    if (p === "W") {
      const a = parse(b.first), z = parse(b.last);
      const txt = MON[a.getUTCMonth()] + " " + a.getUTCDate() + "–" + (a.getUTCMonth() === z.getUTCMonth() ? "" : MON[z.getUTCMonth()] + " ") + z.getUTCDate();
      return long ? "Week of " + txt + ", " + z.getUTCFullYear() : txt;
    }
    if (p === "M") { const [y, m] = b.key.split("-"); return long ? MON[+m - 1] + " " + y : MON[+m - 1] + " ’" + y.slice(2); }
    return b.key + (b.key === asOf.slice(0, 4) ? " YTD" : "");
  }
  const tickFmt = (v) => {
    if (v === 0) return "0";
    const a = Math.abs(v), s = v < 0 ? MINUS : "";
    return a >= 1000 ? s + (a / 1000).toFixed(a % 1000 ? 1 : 0) + "B" : s + a.toFixed(a < 10 && a % 1 ? 1 : 0) + "M";
  };
  const clock = (t) => t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  // ---------- state ----------
  const state = { coin: "ALL", period: "D", sel: null };
  try { const p = localStorage.getItem("sfd-period"); if (PERIODS.some((x) => x.id === p)) state.period = p; } catch (e) {}
  const fromHash = () => { const h = (location.hash || "").slice(1).toUpperCase(); return COINS.some((c) => c.sym === h) ? h : "ALL"; };
  state.coin = fromHash();

  // ---------- tooltip ----------
  const tip = $("#tip");
  function showTip(html, ev) {
    tip.innerHTML = html; tip.hidden = false;
    const r = tip.getBoundingClientRect();
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  }
  const hideTip = () => (tip.hidden = true);
  function topMover(c, b) {
    let i = -1, v = 0;
    b.funds.forEach((x, j) => { if (Math.abs(x) > Math.abs(v)) { v = x; i = j; } });
    return Math.abs(v) >= 0.05 ? { t: c.funds[i][0], v } : null;
  }
  function tipHtml(c, b, p) {
    const m = topMover(c, b);
    return `<div class="t">${c.name} · ${esc(bucketLabel(b, p, true))}</div>
      <div class="r main"><span>Net flow</span><span class="num">${money(b.net)}</span></div>
      <div class="r"><span>Inflows</span><span class="num">${money(b.gin)}</span></div>
      <div class="r"><span>Outflows</span><span class="num">${money(b.gout)}</span></div>
      ${m ? `<div class="r"><span>Largest mover</span><span class="num">${m.t} ${money(m.v)}</span></div>` : ""}
      ${p !== "D" ? `<div class="r"><span>Sessions</span><span class="num">${b.up} in · ${b.down} out</span></div>` : ""}`;
  }

  // ---------- bar chart ----------
  function niceStep(range, count) {
    const raw = range / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  }
  function barPath(x, w, y0, y1) {
    const h = Math.abs(y1 - y0);
    if (h < 0.5) return `M${x},${y0 - 0.5}h${w}v1h${-w}z`;
    const r = Math.min(3, w / 2, h), d = y1 < y0 ? 1 : -1;
    return `M${x},${y0}V${y1 + d * r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + d * r}V${y0}Z`;
  }
  function drawBars(el, c, list, p, opt) {
    const W = el.clientWidth, H = el.clientHeight;
    if (!W || !list.length) return;
    const axis = opt.axis, padL = axis ? 44 : 0, padT = 4, padB = axis ? 22 : 0;
    let lo = Math.min(0, ...list.map((b) => b.net)), hi = Math.max(0, ...list.map((b) => b.net));
    if (lo === hi) hi = 1;
    const ticks = [];
    if (axis) {
      const step = niceStep(hi - lo, 4);
      lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
      for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
    }
    const iw = W - padL, ih = H - padT - padB;
    const y = (v) => padT + ((hi - v) / (hi - lo)) * ih;
    const slot = iw / list.length, gap = Math.max(2, Math.min(slot * 0.3, 10)), bw = Math.max(1, slot - gap);
    let s = "";
    ticks.forEach((t) => {
      const yy = Math.round(y(t)) + 0.5;
      s += `<line x1="${padL}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(${t === 0 ? "--axis" : "--line"})"/>`;
      s += `<text x="${padL - 8}" y="${yy + 3.5}" text-anchor="end">${tickFmt(t)}</text>`;
    });
    if (opt.hits) list.forEach((b, i) => { s += `<rect class="hit${opt.sel === b.key ? " on" : ""}" data-i="${i}" x="${padL + i * slot}" y="${padT}" width="${slot}" height="${ih}" rx="3"/>`; });
    const y0 = y(0);
    list.forEach((b, i) => { s += `<path d="${barPath(padL + i * slot + gap / 2, bw, y0, y(b.net))}" fill="var(${b.net >= 0 ? "--in" : "--out"})" pointer-events="none"/>`; });
    if (!axis) s += `<line x1="0" x2="${W}" y1="${Math.round(y0) + 0.5}" y2="${Math.round(y0) + 0.5}" stroke="var(--axis)"/>`;
    else {
      const every = Math.max(1, Math.ceil(list.length / Math.max(2, Math.floor(iw / 80))));
      list.forEach((b, i) => {
        if ((list.length - 1 - i) % every) return;
        const cx = padL + i * slot + slot / 2, edge = cx > W - 30;
        s += `<text x="${edge ? W - 2 : cx}" y="${H - 5}" text-anchor="${edge ? "end" : "middle"}">${esc(bucketLabel(b, p))}</text>`;
      });
    }
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", `${c.name} net flows, last ${list.length} ${PERIODS.find((x) => x.id === p).unit}`);
    svg.innerHTML = s;
    el.replaceChildren(svg);
    const at = (ev) => {
      if (opt.hits) { const i = ev.target.dataset && ev.target.dataset.i; return i == null ? null : +i; }
      const r = svg.getBoundingClientRect();
      return Math.min(list.length - 1, Math.max(0, Math.floor((ev.clientX - r.left) / slot)));
    };
    svg.addEventListener("pointermove", (ev) => { const i = at(ev); if (i == null) hideTip(); else showTip(tipHtml(c, list[i], p), ev); });
    svg.addEventListener("pointerleave", hideTip);
    if (opt.onPick) svg.addEventListener("click", (ev) => { const i = at(ev); if (i != null) opt.onPick(list[i]); });
  }
  const charts = [];
  const ro = new ResizeObserver(() => charts.forEach((f) => f()));
  function chart(el, fn) { charts.push(fn); ro.observe(el); fn(); }

  // ---------- controls ----------
  function renderControls() {
    $("#coinSeg").innerHTML = `<button data-coin="ALL" aria-pressed="${state.coin === "ALL"}">All</button>` +
      COINS.map((c) => `<button data-coin="${c.sym}" aria-pressed="${state.coin === c.sym}"><span class="dot" style="background:${c.color}"></span>${c.sym}</button>`).join("");
    $("#periodSeg").innerHTML = PERIODS.map((p) => `<button data-period="${p.id}" aria-pressed="${state.period === p.id}">${p.name}</button>`).join("");
  }
  $("#coinSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) go(b.dataset.coin); });
  $("#periodSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.period = b.dataset.period; state.sel = null;
    try { localStorage.setItem("sfd-period", state.period); } catch (err) {}
    render();
  });
  function go(coin) {
    state.coin = coin; state.sel = null;
    try { history.replaceState(null, "", coin === "ALL" ? location.pathname + location.search : "#" + coin.toLowerCase()); } catch (e) {}
    render(); window.scrollTo({ top: 0 });
  }
  window.addEventListener("hashchange", () => { state.coin = fromHash(); state.sel = null; render(); });

  // ---------- overview ----------
  function renderAll(view) {
    const P = PERIODS.find((x) => x.id === state.period);
    const cols = [["D", "Latest"], ["W", "Week"], ["M", "Month"], ["Y", "Year"]];
    const maxPct = Math.max(...COINS.map((c) => Math.abs(current(c.sym, state.period).net / data[c.sym].aum))) || 1;

    const cards = COINS.map((c) => {
      const d = data[c.sym], b = current(c.sym, state.period), list = d.agg[state.period].list.slice(-P.n);
      return `<button class="card" data-coin="${c.sym}" aria-label="Open ${c.name}">
        <span class="coin"><span class="dot" style="background:${c.color}"></span>${c.name}</span>
        <span><span class="label">${P.cur} · ${esc(bucketLabel(b, state.period))}</span><span class="big num ${cls(b.net)}" data-v style="display:block">${money(b.net)}</span></span>
        <span class="gross"><span><i class="sq" style="background:var(--in)"></i><span class="num">${money(b.gin)}</span></span><span><i class="sq" style="background:var(--out)"></i><span class="num">${money(b.gout)}</span></span></span>
        <span class="spark" data-spark="${c.sym}"></span>
        <span class="spark-foot"><span>${esc(bucketLabel(list[0], state.period))}</span><span>${esc(bucketLabel(list[list.length - 1], state.period))}</span></span>
      </button>`;
    }).join("");

    const rows = COINS.map((c) => {
      const d = data[c.sym], pct = current(c.sym, state.period).net / d.aum, w = (Math.abs(pct) / maxPct) * 50;
      return `<tr data-coin="${c.sym}" tabindex="0">
        <td><span class="coin"><span class="dot" style="background:${c.color}"></span>${c.name}</span></td>
        ${cols.map(([id]) => `<td class="${id === state.period ? "hl" : ""}" data-v>${signed(current(c.sym, id).net)}</td>`).join("")}
        <td><span class="num">${money(d.aum, { sign: false })}</span></td>
        <td><span class="pct"><span class="num ${cls(pct * 1e4)}">${(pct >= 0 ? "+" : MINUS) + Math.abs(pct * 100).toFixed(2)}%</span><span class="track"><span class="fill" style="background:var(${pct >= 0 ? "--in" : "--out"});left:${pct >= 0 ? 50 : 50 - w}%;width:${w}%"></span></span></span></td>
        <td>${signed(d.total)}</td>
      </tr>`;
    }).join("");

    view.innerHTML = `
      <section class="cards">${cards}</section>
      <section class="panel"><div class="scroll"><table>
        <thead><tr><th>Asset</th>${cols.map(([id, n]) => `<th class="${id === state.period ? "hl" : ""}">${n}</th>`).join("")}<th>AUM</th><th>${P.name.replace("ly", "").replace("Dai", "Day")} vs AUM</th><th>Since launch</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div></section>`;

    view.querySelectorAll("[data-coin]").forEach((el) => {
      el.addEventListener("click", () => go(el.dataset.coin));
      if (el.tagName === "TR") el.addEventListener("keydown", (e) => { if (e.key === "Enter") go(el.dataset.coin); });
    });
    COINS.forEach((c) => {
      const el = view.querySelector(`[data-spark="${c.sym}"]`), list = data[c.sym].agg[state.period].list.slice(-P.n);
      chart(el, () => drawBars(el, data[c.sym], list, state.period, { axis: false }));
    });
  }

  // ---------- single asset ----------
  function renderCoin(view) {
    const c = data[state.coin], p = state.period, P = PERIODS.find((x) => x.id === p);
    const all = c.agg[p].list, list = all.slice(-P.big);
    const sel = (state.sel && c.agg[p].idx[state.sel]) || all[all.length - 1];

    const tiles = [["D", "Latest session"], ["W", "This week"], ["M", "This month"], ["Y", "Year to date"]].map(([id, name]) => {
      const b = current(c.sym, id);
      return `<div class="tile ${id === p ? "hl" : ""}"><span class="label">${name}</span><span class="v num ${cls(b.net)}" data-v>${money(b.net)}</span>
        <span class="sub"><span class="num">${money(b.gin)}</span> in · <span class="num">${money(b.gout)}</span> out</span></div>`;
    }).join("") + `<div class="tile"><span class="label">Since launch</span><span class="v num ${cls(c.total)}">${money(c.total)}</span><span class="sub">From ${shortDay(c.launch)}, ${c.launch.slice(0, 4)}</span></div>`;

    const funds = c.funds.map((f, i) => ({ t: f[0], who: f[1], v: sel.funds[i] })).filter((f) => Math.abs(f.v) >= 0.05).sort((a, b) => b.v - a.v);
    const flat = c.funds.length - funds.length, mx = Math.max(...funds.map((f) => Math.abs(f.v)), 0.001);
    const breakdown = funds.length
      ? funds.map((f) => `<div class="irow"><div class="who"><b>${f.t}</b><small>${esc(f.who)}</small></div>
          <div class="dtrack"><i class="${f.v >= 0 ? "p" : "n"}" style="width:calc(${(Math.abs(f.v) / mx) * 50}% - 1px)"></i></div>
          <div class="val">${signed(f.v)}</div></div>`).join("") + (flat ? `<div class="note">${flat} fund${flat > 1 ? "s" : ""} unchanged</div>` : "")
      : `<div class="note">No fund-level flows reported for this period.</div>`;

    const recent = all.slice(-12).reverse().map((b) => {
      const m = topMover(c, b);
      return `<tr data-key="${b.key}" class="${b.key === sel.key ? "sel" : ""}" tabindex="0">
        <td>${esc(bucketLabel(b, p))}</td><td>${signed(b.net)}</td>
        <td><span class="num">${money(b.gin)}</span></td><td><span class="num">${money(b.gout)}</span></td>
        <td>${m ? `<span class="num">${m.t}</span> ${signed(m.v)}` : `<span class="flat">—</span>`}</td></tr>`;
    }).join("");

    view.innerHTML = `
      <div class="head"><h2><span class="dot" style="background:${c.color};width:11px;height:11px"></span>${c.name}</h2>
        <span class="meta">${c.funds.length} funds · <span class="num">${money(c.aum, { sign: false })}</span> AUM</span></div>
      <section class="tiles">${tiles}</section>
      <section class="panel">
        <div class="panel-head"><h2>${P.name} net flows</h2>
          <div class="legend"><span><i class="sq" style="background:var(--in)"></i>Inflow</span><span><i class="sq" style="background:var(--out)"></i>Outflow</span></div></div>
        <div class="chart" id="bigChart"></div>
      </section>
      <div class="split">
        <section class="panel"><div class="panel-head"><h2>By fund</h2><span class="hint">${esc(bucketLabel(sel, p, true))}</span></div><div class="issuers">${breakdown}</div></section>
        <section class="panel"><div class="scroll"><table class="recent"><thead><tr><th>${P.unit.replace(/s$/, "").replace(/^./, (x) => x.toUpperCase())}</th><th>Net</th><th>In</th><th>Out</th><th>Largest mover</th></tr></thead><tbody>${recent}</tbody></table></div></section>
      </div>`;

    const pick = (key) => { state.sel = key; render(); };
    view.querySelectorAll("tr[data-key]").forEach((tr) => {
      tr.addEventListener("click", () => pick(tr.dataset.key));
      tr.addEventListener("keydown", (e) => { if (e.key === "Enter") pick(tr.dataset.key); });
    });
    const el = $("#bigChart", view);
    chart(el, () => drawBars(el, c, list, p, { axis: true, hits: true, sel: sel.key, onPick: (b) => pick(b.key) }));
  }

  function render(flash) {
    charts.length = 0; ro.disconnect(); hideTip();
    renderControls();
    const view = $("#view");
    if (state.coin === "ALL") renderAll(view); else renderCoin(view);
    if (flash) view.querySelectorAll("[data-v]").forEach((el) => el.classList.add("flash"));
    $("#foot").innerHTML = `Latest session ${longDay(asOf)}. Source: <a href="https://cryptoetf.today/en/bitcoin-etf-flows" target="_blank" rel="noopener">cryptoetf.today</a>. Flows are reported once per trading day after the US close.`;
  }

  // ---------- hourly refresh ----------
  const statusEl = $("#status"), liveText = $("#liveText"), btn = $("#refreshBtn"), bar = $("#progress");
  let lastCheck = Date.now(), nextAt = lastCheck + HOUR, busy = false;

  function loadScript() {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "data.js?t=" + Date.now();
      s.onload = () => { s.remove(); resolve(window.FLOWS); };
      s.onerror = () => { s.remove(); reject(new Error("load failed")); };
      document.head.appendChild(s);
    });
  }
  async function refresh() {
    if (busy) return;
    busy = true; btn.classList.add("spin"); bar.classList.add("busy"); liveText.textContent = "Refreshing…";
    const before = D.updatedAt + "|" + D.asOf;
    try {
      const next = await loadScript();
      statusEl.classList.remove("err");
      const changed = next && next.updatedAt + "|" + next.asOf !== before;
      if (changed) { build(next); render(true); }
      liveText.textContent = changed ? "New data · " + shortDay(asOf) : "Up to date";
      setTimeout(() => { if (!busy) liveText.textContent = "Refreshes hourly"; }, 6000);
    } catch (e) {
      statusEl.classList.add("err");
      liveText.textContent = "Refresh failed · retrying next hour";
    }
    lastCheck = Date.now(); nextAt = lastCheck + HOUR;
    $("#checked").textContent = clock(new Date(lastCheck));
    busy = false; btn.classList.remove("spin"); bar.classList.remove("busy");
    tick();
  }
  function tick() {
    const left = Math.max(0, nextAt - Date.now());
    const mm = Math.floor(left / 60000), ss = Math.floor((left % 60000) / 1000);
    $("#countdown").textContent = String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
    const pct = 100 * (1 - left / HOUR);
    bar.firstElementChild.style.width = pct + "%";
    bar.setAttribute("aria-valuenow", Math.round(pct));
    if (left === 0) refresh();
  }
  btn.addEventListener("click", refresh);

  // ---------- light / dark toggle ----------
  const root = document.documentElement, themeBtn = $("#themeBtn");
  const systemDark = window.matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => (root.dataset.theme ? root.dataset.theme === "dark" : systemDark.matches);
  function syncThemeBtn() {
    const dark = isDark(), label = dark ? "Switch to light mode" : "Switch to dark mode";
    root.classList.toggle("is-dark", dark);
    themeBtn.setAttribute("aria-label", label); themeBtn.title = label;
  }
  themeBtn.addEventListener("click", () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("sfd-theme", root.dataset.theme); } catch (e) {}
    syncThemeBtn();
  });
  systemDark.addEventListener("change", syncThemeBtn);
  syncThemeBtn();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

  build(window.FLOWS);
  render();
  $("#checked").textContent = clock(new Date(lastCheck));
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
